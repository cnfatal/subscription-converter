server:
  listen: 127.0.0.1:9099

# Applied to every subscription. These tracked defaults preserve the TUN
# inbound, add a local mixed proxy, and apply the repository routing rules.
patches:
  - source: ./rules/proxy-rules.yaml
    format: clash
  - source: ./rules/inbounds.yaml
    format: sing-box
# Additional patch examples:
#   - source: https://example.com/rules.yaml
#     headers:
#       Authorization: Bearer replace-me
#     timeout: 30s
#     cache: 1h
#   - source: ./rules/sing-box.json
#     format: sing-box
#   - source: ./rules/advanced.yaml
#     format: patch

subscriptions:
  - name: primary
    source: https://example.com/subscription?token=replace-me
    timeout: 30s
    cache: 10m
    # patches:
    #   - source: ./rules/primary.yaml
  - name: backup
    source: ./backup-clash.yaml
    format: clash
